<header class="relative flex items-center gap-3 border-b border-slate-200 bg-white px-3 pb-2 safe-top">
  <div class="flex min-w-0 items-center gap-2">
    <span
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-sky-600 text-sm font-black text-white"
      >SB</span
    >
    <div class="leading-tight">
      <p class="text-sm font-bold text-slate-900">Bus_MATI</p>
      <p class="text-[11px] text-slate-500">Córdoba Capital</p>
    </div>
  </div>

  <div class="flex flex-1 items-center justify-end gap-2">
    <button
      type="button"
      class="flex h-9 max-w-[9.5rem] shrink items-center gap-1 rounded-full bg-slate-100 px-3 text-xs font-bold text-slate-700 transition-colors hover:bg-slate-200"
      [attr.aria-expanded]="menuAbierto() === 'corredores'"
      aria-haspopup="true"
      aria-label="Ver corredores"
      (click)="alternarMenu('corredores')"
    >
      <span class="truncate">{{ corredorActivo() }}</span>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="h-4 w-4 shrink-0"
        aria-hidden="true"
      >
        <path d="m6 9 6 6 6-6" />
      </svg>
    </button>

    <button
      type="button"
      class="relative flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-slate-100 text-slate-600 transition-colors hover:bg-slate-200"
      [attr.aria-expanded]="menuAbierto() === 'puntos'"
      aria-haspopup="true"
      aria-label="Mis puntos de control"
      title="Mis puntos de control"
      (click)="alternarMenu('puntos')"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="h-5 w-5"
        aria-hidden="true"
      >
        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
        <path d="M12 10.5V4" />
        <path d="M12 5h4.5L15 7l1.5 2H12" />
      </svg>
      @if (cantidadPuntos() > 0) {
        <span
          class="absolute -top-1 -right-1 flex h-4 min-w-4 items-center justify-center rounded-full bg-sky-600 px-1 text-[10px] font-bold text-white"
        >
          {{ cantidadPuntos() }}
        </span>
      }
    </button>

    <button
      type="button"
      [class]="claseBotonUbicacion()"
      [attr.aria-busy]="geolocation.estado() === 'solicitando'"
      [title]="tituloUbicacion()"
      aria-label="Mi ubicación"
      (click)="solicitarUbicacion()"
    >
      @if (geolocation.estado() === 'solicitando') {
        <span
          class="h-4 w-4 animate-spin rounded-full border-2 border-slate-400 border-t-transparent"
          aria-hidden="true"
        ></span>
      } @else {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="h-5 w-5"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="3" />
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
          <circle cx="12" cy="12" r="8" />
        </svg>
      }
    </button>
  </div>

  @if (menuAbierto()) {
    <button
      type="button"
      class="fixed inset-0 z-[1140] cursor-default"
      aria-label="Cerrar menú"
      (click)="cerrarMenu()"
    ></button>
  }

  @if (menuAbierto() === 'corredores') {
    <div
      class="absolute inset-x-0 top-full z-[1150] max-h-[60vh] overflow-y-auto border-b border-slate-200 bg-white p-2 shadow-xl"
      role="menu"
      aria-label="Corredores"
    >
      @for (corredor of corredores(); track corredor) {
        <button type="button" role="menuitem" [class]="claseCorredor(corredor)" (click)="seleccionarCorredor(corredor)">
          <span>{{ corredor }}</span>
          @if (esCorredorActivo(corredor)) {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="h-4 w-4 shrink-0"
              aria-hidden="true"
            >
              <path d="m5 13 4 4L19 7" />
            </svg>
          }
        </button>
      } @empty {
        <p class="px-3 py-4 text-center text-xs text-slate-400">Sin corredores disponibles</p>
      }
    </div>
  }

  @if (menuAbierto() === 'puntos') {
    <app-control-points-panel
      class="absolute inset-x-0 top-full z-[1150]"
      (cerrado)="cerrarMenu()"
    />
  }
</header>
