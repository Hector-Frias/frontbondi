<header class="flex items-center gap-3 border-b border-slate-200 bg-white px-3 pb-2 safe-top">
  <div class="flex items-center gap-2">
    <span
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-sky-600 text-sm font-black text-white"
      >SB</span
    >
    <div class="leading-tight">
      <p class="text-sm font-bold text-slate-900">Bus_MATI</p>
      <p class="text-[11px] text-slate-500">Córdoba Capital</p>
    </div>
  </div>

  <nav
    class="flex min-w-0 flex-1 items-center gap-2 overflow-x-auto scrollbar-none"
    aria-label="Corredores"
  >
    @for (corredor of corredores(); track corredor) {
      <button
        type="button"
        [class]="claseCorredor(corredor)"
        (click)="seleccionarCorredor(corredor)"
      >
        {{ corredor }}
      </button>
    }
  </nav>

  <button
    type="button"
    disabled
    title="Ubicación del pasajero: disponible en el Sprint 3"
    aria-label="Mi ubicación"
    class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-slate-100 text-slate-400"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="h-5 w-5"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="3" />
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
      <circle cx="12" cy="12" r="8" />
    </svg>
  </button>
</header>
